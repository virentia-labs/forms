name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: forms

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: forms

      - name: Checkout Virentia
        uses: actions/checkout@v4
        with:
          repository: virentia-labs/virentia
          ref: refs/tags/@virentia/core@0.12.0
          path: virentia
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false
          package_json_file: forms/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            virentia/pnpm-lock.yaml
            forms/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Pinned to 11.x: npm 12 changed `npm info --json` to return an array
      # instead of an object, so changesets reads `.versions` off it, gets
      # undefined, and treats every package as unpublished. It then retries an
      # already-published version and crashes handling the resulting E403.
      - name: Set up npm
        run: npm install -g npm@11

      - name: Build Virentia dependencies
        working-directory: virentia
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @virentia/core --filter @virentia/react --filter @virentia/vue --filter @virentia/effector run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link shared runtime dependencies
        working-directory: ${{ github.workspace }}
        run: node virentia/scripts/check-ecosystem.mjs --phase link --repo forms

      - name: Verify release commit
        run: |
          pending_changesets="$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" -print)"

          if [ -n "$pending_changesets" ]; then
            echo "Pending changesets found:"
            echo "$pending_changesets"
            echo "Run pnpm prepare-release locally, commit the generated release changes, and rerun this workflow."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure release git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        run: git push --follow-tags
